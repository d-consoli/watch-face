name: Build watch face
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Ensure pinned SDK packages
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/36.0.0/aapt2" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          fi
      - name: Check generated XML and images
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/generate_face.py
          python tools/render_preview.py
          git diff --exit-code -- watchface/src/main/res docs/images
      - name: Validate with Google's WFF validator
        run: python tools/validate.py
      - name: Assemble and lint
        run: ./gradlew :watchface:assembleDebug :watchface:lintDebug --no-daemon
      - name: Verify SDK-only build
        run: python tools/build_apk.py
      - name: Check resource-only APKs
        run: |
          python tools/check_apk.py build/fast/modular-lab-debug.apk
          python tools/check_apk.py watchface/build/outputs/apk/debug/watchface-debug.apk
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: modular-lab-debug
          path: |
            watchface/build/outputs/apk/debug/watchface-debug.apk
            build/fast/modular-lab-debug.apk
            watchface/build/reports/lint-results-debug.html
          if-no-files-found: error
