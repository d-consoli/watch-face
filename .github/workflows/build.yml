name: Build watch face
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Install pinned SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Check generated XML and images
        run: |
          python -m pip install -r requirements-dev.txt
          python tools/generate_face.py
          python tools/render_preview.py
          git diff --exit-code -- watchface/src/main/res docs/images
      - name: Validate with Google's WFF validator
        run: python tools/validate.py
      - name: Assemble and lint
        run: ./gradlew :watchface:assembleDebug :watchface:lintDebug --no-daemon
      - name: Verify SDK-only build
        run: python tools/build_apk.py
      - name: Check resource-only APKs
        run: |
          python tools/check_apk.py build/fast/modular-lab-debug.apk
          python tools/check_apk.py watchface/build/outputs/apk/debug/watchface-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: modular-lab-debug
          path: |
            watchface/build/outputs/apk/debug/watchface-debug.apk
            build/fast/modular-lab-debug.apk
            watchface/build/reports/lint-results-debug.html
          if-no-files-found: error
